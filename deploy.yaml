apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: nginx-dploy
  annotations: 
    kubernetes.io/change-cause: "Initial Release with nginx 1.19"
spec: 
  replicas: 3
  selector: 
    matchLabels: 
      app: nginx
  template: 
    metadata: 
      labels: 
        app: nginx
        environment: development
    spec: 
      containers: 
        - name: nginx-deploy
          image: nginx:1.19

