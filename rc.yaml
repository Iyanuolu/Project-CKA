apiVersion: v1
kind: ReplicationController
metadata: 
  name: nginx-rc
spec: 
  replicas: 4
  selector: 
    app: nginx
    #environment: development
  template: 
    metadata: 
      labels: 
        app: nginx
        environment: development
    spec: 
      containers: 
        - name: nginx-container
          image: nginx
      